<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New password — HexXstrap Cloud</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">Hex<i>X</i>strap</a>
    <span class="nav-spacer"></span>
    <span id="nav-auth"></span>
  </nav>
  <main class="wrap">
    <h1>New password</h1>
    <div class="card auth">
      <label>New password</label>
      <input id="password" type="password" autocomplete="new-password" />
      <div class="row"><button id="go" type="button">Save password</button></div>
      <div id="msg" class="msg"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    $("go").onclick = async () => {
      try {
        const sb = getClient();
        const { error } = await sb.auth.updateUser({ password: $("password").value });
        if (error) throw error;
        showMsg($("msg"), "Password updated.", "ok");
        setTimeout(() => location.href = "me.html", 700);
      } catch (e) {
        showMsg($("msg"), e.message || String(e), "err");
      }
    };
  </script>
</body>
</html>
