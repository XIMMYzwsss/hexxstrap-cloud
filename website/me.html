<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My FastFlags — HexXstrap Cloud</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">Hex<i>X</i>strap</a>
    <a class="n" href="index.html">Explore</a>
    <span class="nav-spacer"></span>
    <span id="nav-auth"></span>
  </nav>
  <main class="wrap">
    <h1>My FastFlags</h1>
    <p class="lead">Edit the FastFlags JSON HexXstrap syncs for Explore. App settings are not shared.</p>
    <div class="card">
      <div class="meta">
        <span>User <b id="uname">—</b></span>
        <span>Saved <b id="when">—</b></span>
        <label class="toggle"><input id="pub" type="checkbox" checked /> Public profile</label>
      </div>
      <label>FastFlags JSON</label>
      <textarea id="json"></textarea>
      <div class="row">
        <button id="save" type="button">Save FastFlags</button>
        <button id="reload" class="secondary" type="button">Reload</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function load() {
      const sb = getClient();
      const user = await currentUser();
      if (!user) { location.href = "login.html"; return; }
      const { data: profile, error: pErr } = await sb.from("profiles").select("*").eq("id", user.id).single();
      if (pErr) throw pErr;
      $("uname").textContent = profile.username;
      $("pub").checked = profile.is_public;
      const { data: row, error: cErr } = await sb.from("configs").select("fast_flags, updated_at").eq("user_id", user.id).single();
      if (cErr) throw cErr;
      $("when").textContent = formatWhen(row && row.updated_at);
      $("json").value = JSON.stringify((row && row.fast_flags) || {}, null, 2);
    }

    $("reload").onclick = async () => {
      try { await load(); showMsg($("msg"), "Reloaded.", "ok"); }
      catch (e) { showMsg($("msg"), e.message || String(e), "err"); }
    };

    $("save").onclick = async () => {
      try {
        const sb = getClient();
        const user = await currentUser();
        if (!user) { location.href = "login.html"; return; }
        const parsed = JSON.parse($("json").value || "{}");
        if (parsed == null || typeof parsed !== "object" || Array.isArray(parsed))
          throw new Error("FastFlags must be a JSON object.");
        const { error: cErr } = await sb.from("configs").upsert({
          user_id: user.id,
          settings: {},
          fast_flags: parsed,
          roblox_global: {},
          nvidia_flags: {},
          extra: {}
        });
        if (cErr) throw cErr;
        const { error: pErr } = await sb.from("profiles").update({ is_public: $("pub").checked }).eq("id", user.id);
        if (pErr) throw pErr;
        await load();
        showMsg($("msg"), "Saved.", "ok");
      } catch (e) {
        showMsg($("msg"), e.message || String(e), "err");
      }
    };

    load().catch((e) => showMsg($("msg"), e.message || String(e), "err"));
  </script>
</body>
</html>
